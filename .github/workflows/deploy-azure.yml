name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build API
        run: pip install -r api/requirements.txt -t api/.python_packages/lib/site-packages
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.API_WEBAPP_NAME }}
          package: api

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Point the UI at the published API
        run: |
          set -euo pipefail
          api="https://${{ vars.API_WEBAPP_NAME }}.azurewebsites.net"
          find ui -name index.html -not -path '*/node_modules/*' -print0 \
                        | xargs -0 --no-run-if-empty sed -i "s|__API_BASE_URL_VALUE__|$api|g"
      - name: Build UI
        working-directory: ui
        run: npm install && npm run build --if-present
      - name: Package compiled UI for App Service
        run: |
          set -euo pipefail
          rm -rf ui-deploy
          mkdir -p ui-deploy/public
          index=$(find ui/dist -name index.html -print -quit)
          test -n "$index"
          cp -R "$(dirname "$index")/." ui-deploy/public/
          cp ui/server.mjs ui-deploy/server.mjs
          printf '%s\n' '{"private":true,"type":"module","scripts":{"start":"node server.mjs"}}' > ui-deploy/package.json
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.UI_WEBAPP_NAME }}
          package: ui-deploy


      - name: Smoke test the published app
        env:
          API: https://${{ vars.API_WEBAPP_NAME }}.azurewebsites.net
          UI: https://${{ vars.UI_WEBAPP_NAME }}.azurewebsites.net
        run: |
          set -euo pipefail
          wait_for () {
            for attempt in $(seq 1 10); do
              if curl -fsS --max-time 20 "$1" > /dev/null; then
                echo "reachable: $1"
                return 0
              fi
              sleep 15
            done
            echo "timed out waiting for $1" >&2
            return 1
          }
          wait_for "${API}/health"
          wait_for "${API}/openapi.json"
          wait_for "${UI}"

                    curl_retry=(--fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 --max-time 30)
                    curl "${curl_retry[@]}" "${API}/api/maintenances" -o items.json
          python3 -c "import json; rows=json.load(open('items.json')); assert rows, 'seed data missing'; print(len(rows), 'rows served')"

                    created=$(curl "${curl_retry[@]}" -X POST "${API}/api/maintenances" \
            -H 'content-type: application/json' \
            -d '{"title": "Deployment smoke test"}')
          id=$(python3 -c "import json,sys; print(json.loads(sys.argv[1])['id'])" "$created")
                    curl "${curl_retry[@]}" -X PATCH "${API}/api/maintenances/${id}" \
            -H 'content-type: application/json' -d '{"status": "complete"}' > /dev/null
                    curl "${curl_retry[@]}" -X DELETE "${API}/api/maintenances/${id}" > /dev/null
          echo "CRUD round trip passed"
      - name: "DevOps & Release Agent: record verified links in README"
        env:
          API_APP: ${{ vars.API_WEBAPP_NAME }}
          UI_APP: ${{ vars.UI_WEBAPP_NAME }}
        run: python3 .github/scripts/record_published_links.py

      - name: Commit release-agent documentation
        run: |
          if git diff --quiet -- README.md; then
            echo "README already current"
            exit 0
          fi
          git config user.name "agentic-sdlc-release-agent[bot]"
          git config user.email "agentic-sdlc-release-agent@users.noreply.github.com"
          git add README.md
          git commit -m "DevOps Release Agent: record published links [skip ci]"
          git push